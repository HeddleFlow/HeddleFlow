name: Report a bug
description: Something HeddleFlow does wrong, or differently from what its documents say.
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What HeddleFlow did, with any message it printed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      multiple: true
      options: [Claude Code, GitHub Copilot, OpenAI Codex, Cursor, Google Antigravity, OpenCode]
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      multiple: true
      options: [CLI, Editor, Desktop app, Cloud agent, CI]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HeddleFlow's version
      description: What `uv run .heddleflow/hdf.py version` prints in the project.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a fresh project, each command and prompt in order.
    validations:
      required: true
